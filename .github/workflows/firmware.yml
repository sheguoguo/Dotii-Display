name: Build firmware

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "main/**"
      - "components/**"
      - "managed_components/**"
      - "CMakeLists.txt"
      - "partitions.csv"
      - "sdkconfig.defaults"
      - "dependencies.lock"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4

      # 配网信息不入库：仓库是公开的，WiFi 密码和 bridge token 一律走
      # Repository secrets，构建前注入 sdkconfig.defaults。
      - name: Inject device provisioning
        shell: bash
        env:
          WIFI_SSID: ${{ secrets.DOTII_WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.DOTII_WIFI_PASSWORD }}
          BRIDGE_URL: ${{ secrets.DOTII_BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.DOTII_BRIDGE_TOKEN }}
        run: |
          if [ -z "${WIFI_PASSWORD}" ]; then
            echo "::warning::DOTII_WIFI_PASSWORD 未配置，固件将不带 WiFi 密码"
          fi
          {
            echo "CONFIG_STATE_DISPLAY_WIFI_SSID=\"${WIFI_SSID}\""
            echo "CONFIG_STATE_DISPLAY_WIFI_PASSWORD=\"${WIFI_PASSWORD}\""
            echo "CONFIG_STATE_DISPLAY_BRIDGE_URL=\"${BRIDGE_URL}\""
            echo "CONFIG_STATE_DISPLAY_BRIDGE_TOKEN=\"${BRIDGE_TOKEN}\""
          } >> sdkconfig.defaults
          grep -c "^CONFIG_STATE_DISPLAY_" sdkconfig.defaults

      - name: Report versions
        run: |
          . /opt/esp/idf/export.sh
          idf.py --version

      - name: Build firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          # MINIMAL_BUILD 与仓库内已提交的 managed_components 都是构建输入，
          # 不依赖 Component Manager 联网拉取。
          idf.py -B build build

      - name: Show image info
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python -m esptool --chip esp32s3 image_info build/state_display.bin || true
          ls -l build/bootloader/bootloader.bin \
                build/partition_table/partition-table.bin \
                build/state_display.bin

      - name: Collect flashable images
        shell: bash
        run: |
          mkdir -p out/bootloader out/partition_table
          cp build/bootloader/bootloader.bin out/bootloader/
          cp build/partition_table/partition-table.bin out/partition_table/
          cp build/state_display.bin out/
          cp build/flasher_args.json out/ || true
          cd out && find . -type f -exec sha256sum {} \; | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dotii-firmware-${{ github.sha }}
          path: out/**
          if-no-files-found: error
          retention-days: 30
